<div class="password-toggle-wrapper">
    <input type="{{ widget.type }}"
           name="{{ widget.name }}"
           {% include "django/forms/widgets/attrs.html" %}>

    <button type="button"
            class="button password-toggle-btn"
            onclick="togglePassword_{{ widget.attrs.id }}()">
        <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M1 12C3.5 7 7.5 4 12 4s8.5 3 11 8c-2.5 5-6.5 8-11 8s-8.5-3-11-8z"
                  stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
        </svg>

        <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none">
            <path d="M2 2l20 20" stroke="currentColor" stroke-width="2"/>
            <path d="M1 12C3.5 7 7.5 4 12 4c2.5 0 4.8.8 6.8 2.3M23 12c-1.2 2.4-2.9 4.4-4.9 5.8C16.3 19 14.2 20 12 20c-4.5 0-8.5-3-11-8 1-2 2.3-3.7 3.9-5"
                  stroke="currentColor" stroke-width="2"/>
        </svg>
    </button>
</div>

<script>
function togglePassword_{{ widget.attrs.id }}() {
    const input = document.getElementById("{{ widget.attrs.id }}");
    const wrapper = input.parentElement;
    const eyeOpen = wrapper.querySelector(".eye-open");
    const eyeClosed = wrapper.querySelector(".eye-closed");

    const isHidden = input.type === "password";

    input.type = isHidden ? "text" : "password";
    eyeOpen.style.display = isHidden ? "none" : "block";
    eyeClosed.style.display = isHidden ? "block" : "none";
}
</script>
